<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Control - CASINO BIGBOLA</title>
    
    <meta name="theme-color" content="#0b0c10">
    <link rel="apple-touch-icon" href="logo.jpg">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #151722;
            --neon-cyan: #00f0ff;
            --neon-red: #ff003c;
            --neon-gold: #d4af37;
            --neon-purple: #b026ff;
            --neon-green: #25D366;
            --neon-orange: #ff6600;
            --silver-metal: #d9dadb;
            --border-color: #2a2d3d;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
            font-size: 16px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Encabezado */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 15px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .admin-title {
            color: var(--silver-metal);
            font-size: 1.15em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .admin-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--silver-metal);
            box-shadow: 0 0 10px rgba(217, 218, 219, 0.3);
        }

        .btn-view-app {
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Tarjetas */
        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .admin-card.push-card {
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.15em;
            color: var(--neon-purple);
        }

        .push-card .card-header h2 {
            color: var(--neon-cyan);
        }

        label {
            display: block;
            color: #c5c6c7;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #0b0c10;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--neon-cyan);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1em;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-push {
            background: linear-gradient(90deg, var(--neon-purple), #7928ca);
            color: white;
        }

        .btn-save {
            background: linear-gradient(90deg, #0070f3, var(--neon-cyan));
            color: black;
        }

        .btn-add-table {
            background: linear-gradient(90deg, var(--neon-gold), #ff8800);
            color: black;
        }

        /* Mesas */
        .form-crear-mesa {
            background: #0e1017;
            border: 1px dashed var(--neon-cyan);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .mesa-item {
            background: #0e1017;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .mesa-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .mesa-nombre {
            font-weight: bold;
            font-size: 1.05em;
            color: white;
        }

        .mesa-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mesa-estatus-select {
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .mesa-estatus-select.abierta {
            background: rgba(37, 211, 102, 0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .mesa-estatus-select.cerrada {
            background: rgba(255, 0, 60, 0.15);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        /* Control para jugadores (+ / -) */
        .stepper-container {
            display: flex;
            align-items: center;
            background: #0b0c10;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            height: 48px;
        }

        .btn-step {
            width: 50px;
            height: 100%;
            background: #1c1f2e;
            color: var(--neon-cyan);
            border: none;
            font-size: 1.6em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
            touch-action: manipulation;
        }

        .btn-step:active {
            background: var(--neon-cyan);
            color: black;
            transform: scale(0.95);
        }

        .stepper-display {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 1.25em;
            color: white;
        }

        /* Botones de frases rápidas (1 toque) */
        .preset-badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .btn-preset {
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.78em;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid transparent;
            background: #151722;
            transition: 0.15s;
        }

        .btn-preset:active {
            transform: scale(0.94);
        }

        .btn-preset.fuego {
            background: rgba(255, 102, 0, 0.15);
            color: #ff6600;
            border-color: #ff6600;
        }

        .btn-preset.fuerte {
            background: rgba(0, 240, 255, 0.15);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        .btn-preset.ultimos {
            background: rgba(255, 0, 60, 0.15);
            color: var(--neon-red);
            border-color: var(--neon-red);
        }

        .btn-preset.limpiar {
            background: rgba(255, 255, 255, 0.05);
            color: #8892b0;
            border-color: #444;
        }

        .mesa-botones {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-del-mesa {
            background: rgba(255, 0, 60, 0.15);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header class="admin-header">
            <div class="admin-title">
                <img src="logo.jpg" alt="Casino BigBola" class="admin-logo" onerror="this.src='logo.png'">
                <span>Admin CASINO BIGBOLA</span>
            </div>
            <a href="index.html" class="btn-view-app">📱 Ir a App</a>
        </header>

        <!-- 1. MÓDULO PUSH -->
        <section class="admin-card push-card">
            <div class="card-header">
                <span style="font-size: 1.4em;">📢</span>
                <h2>Enviar Notificación Push</h2>
            </div>
            <p style="color: #8892b0; font-size: 0.85em; margin-top: 0;">
                Llega de inmediato a la pantalla de bloqueo de los clientes suscritos.
            </p>

            <label>Título de la Alerta</label>
            <input type="text" id="push-titulo" placeholder="Ej. 🎁 ¡Ruleta con Jackpot al Máximo!">

            <label>Mensaje</label>
            <textarea id="push-mensaje" rows="2" placeholder="Ej. La mesa ya está abierta. ¡Entra y aparta tu lugar ahora!"></textarea>

            <button class="btn-action btn-push" id="btn-enviar-push" onclick="enviarPush()">
                🚀 Enviar a Todos los Celulares
            </button>
        </section>

        <!-- 2. GESTOR DE PROMOCIONES -->
        <section class="admin-card">
            <div class="card-header">
                <span style="font-size: 1.4em;">🏷️</span>
                <h2>Nueva Promoción</h2>
            </div>

            <label>Tipo de Promoción</label>
            <select id="promo-tipo">
                <option value="General">📢 General (Tarjeta fija)</option>
                <option value="Flash">⚡ Oferta Flash (Marquesina roja)</option>
            </select>

            <label>Título</label>
            <input type="text" id="promo-titulo" placeholder="Ej. 2x1 en Bebidas VIP">

            <label>Descripción</label>
            <textarea id="promo-descripcion" rows="2" placeholder="Ej. Válido en mesas abiertas hasta las 11:00 PM."></textarea>

            <button class="btn-action btn-save" onclick="crearPromocion()">
                ➕ Publicar Promoción
            </button>

            <div id="lista-promos" style="margin-top: 20px;"></div>
        </section>

        <!-- 3. GESTOR DE MESAS (CREAR Y EDITAR) -->
        <section class="admin-card">
            <div class="card-header">
                <span style="font-size: 1.4em;">🎲</span>
                <h2>Gestión de Mesas</h2>
            </div>

            <!-- FORMULARIO CREAR MESA -->
            <div class="form-crear-mesa">
                <h3 style="color: var(--neon-gold); margin: 0 0 10px 0; font-size: 1.05em; display: flex; align-items: center; gap: 6px;">
                    <span>➕</span> Agregar Nueva Mesa
                </h3>

                <div class="mesa-grid">
                    <div>
                        <label>Nombre de la Mesa</label>
                        <input type="text" id="nueva-mesa-nombre" placeholder="Ej. Mesa VIP 1">
                    </div>
                    <div>
                        <label>Juego</label>
                        <select id="nueva-mesa-juego">
                            <option value="Blackjack">Blackjack</option>
                            <option value="Ruleta">Ruleta</option>
                            <option value="Texas Hold'em">Texas Hold'em</option>
                            <option value="Bacará">Bacará</option>
                            <option value="Craps">Craps</option>
                        </select>
                    </div>
                </div>

                <div class="mesa-grid" style="margin-top: 6px;">
                    <div>
                        <label>Capacidad Máx.</label>
                        <input type="number" id="nueva-mesa-capacidad" value="7" min="1" max="50">
                    </div>
                    <div>
                        <label>Apuesta Mínima ($)</label>
                        <input type="number" id="nueva-mesa-apuesta-min" value="50" min="0">
                    </div>
                </div>

                <div class="mesa-grid" style="margin-top: 6px;">
                    <div>
                        <label>Crupier</label>
                        <input type="text" id="nueva-mesa-crupier" placeholder="Ej. Carlos M.">
                    </div>
                    <div>
                        <label>Estatus Inicial</label>
                        <select id="nueva-mesa-estatus">
                            <option value="Abierta">🟢 Abierta</option>
                            <option value="Cerrada" selected>🔴 Cerrada</option>
                        </select>
                    </div>
                </div>

                <div class="mesa-grid" style="margin-top: 6px;">
                    <div>
                        <label>Jackpot Inicial ($)</label>
                        <input type="number" id="nueva-mesa-jackpot" value="0">
                    </div>
                    <div>
                        <label>Promo / Estado</label>
                        <input type="text" id="nueva-mesa-promo" placeholder="Ej. Bono de $500">
                    </div>
                </div>

                <button class="btn-action btn-add-table" onclick="crearMesa()">
                    ➕ Registrar Mesa
                </button>
            </div>

            <!-- LISTADO DE MESAS EXISTENTES -->
            <h3 style="color: var(--neon-cyan); font-size: 1em; margin-bottom: 12px;">Mesas en Operación</h3>
            <div id="contenedor-mesas-admin">
                <p style="text-align: center; color: #8892b0;">Cargando mesas...</p>
            </div>
        </section>

    </div>

    <script>
        const SUPABASE_URL = "https://kqgtyzsxwrkomdtuktkk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_on1rkqvAIhSQonTODdk5fA_qTpEo_8H";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ENVÍO DE PUSH
        async function enviarPush() {
            const inputTitulo = document.getElementById('push-titulo');
            const inputMensaje = document.getElementById('push-mensaje');
            const btn = document.getElementById('btn-enviar-push');

            const titulo = inputTitulo.value.trim();
            const mensaje = inputMensaje.value.trim();

            if (!titulo || !mensaje) {
                alert("Por favor escribe el título y el mensaje.");
                return;
            }

            if (!confirm(`¿Confirmas el envío?\n\n"${titulo}"`)) return;

            btn.disabled = true;
            btn.innerHTML = "⏳ Enviando notificación...";

            try {
                const response = await fetch("/api/push", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ titulo, mensaje })
                });

                const data = await response.json();

                if (response.ok && !data.errors) {
                    alert(`¡Notificación enviada exitosamente!\nDestinatarios: ${data.recipients || 1}`);
                    inputTitulo.value = '';
                    inputMensaje.value = '';
                } else {
                    alert("Error al enviar: " + JSON.stringify(data.errors || data.error));
                }
            } catch (err) {
                alert("Error de conexión: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = "🚀 Enviar a Todos los Celulares";
            }
        }

        // PROMOCIONES
        async function crearPromocion() {
            const tipo = document.getElementById('promo-tipo').value;
            const titulo = document.getElementById('promo-titulo').value.trim();
            const descripcion = document.getElementById('promo-descripcion').value.trim();

            if (!titulo || !descripcion) {
                alert("Completa todos los campos de la promoción.");
                return;
            }

            const { error } = await client.from('promociones').insert([{
                tipo,
                titulo,
                descripcion,
                activa: true
            }]);

            if (error) {
                alert("Error: " + error.message);
            } else {
                document.getElementById('promo-titulo').value = '';
                document.getElementById('promo-descripcion').value = '';
                cargarPromociones();
            }
        }

        async function togglePromo(id, estadoActual) {
            await client.from('promociones').update({ activa: !estadoActual }).eq('id', id);
            cargarPromociones();
        }

        async function eliminarPromo(id) {
            if (confirm("¿Eliminar esta promoción?")) {
                await client.from('promociones').delete().eq('id', id);
                cargarPromociones();
            }
        }

        async function cargarPromociones() {
            const { data: promos } = await client.from('promociones').select('*').order('fecha_creacion', { ascending: false });
            const contenedor = document.getElementById('lista-promos');
            
            if (promos && promos.length > 0) {
                contenedor.innerHTML = promos.map(p => `
                    <div style="background: #0b0c10; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                        <div>
                            <strong style="color: ${p.tipo === 'Flash' ? 'var(--neon-red)' : 'var(--neon-purple)'}; font-size: 0.85em;">[${p.tipo}]</strong>
                            <strong style="color: white; display: block; font-size: 0.95em;">${p.titulo}</strong>
                            <span style="color: #8892b0; font-size: 0.8em;">${p.descripcion}</span>
                        </div>
                        <div style="display: flex; gap: 6px; flex-shrink: 0;">
                            <button onclick="togglePromo('${p.id}', ${p.activa})" style="background: ${p.activa ? 'rgba(37,211,102,0.2)' : 'rgba(255,255,255,0.1)'}; color: ${p.activa ? 'var(--neon-green)' : '#888'}; border: 1px solid ${p.activa ? 'var(--neon-green)' : '#555'}; padding: 6px 10px; border-radius: 6px; font-size: 0.8em; font-weight: bold; cursor: pointer;">
                                ${p.activa ? 'Activa' : 'Pausada'}
                            </button>
                            <button onclick="eliminarPromo('${p.id}')" style="background: rgba(255,0,60,0.2); color: var(--neon-red); border: 1px solid var(--neon-red); padding: 6px 10px; border-radius: 6px; font-size: 0.8em; cursor: pointer;">
                                🗑️
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                contenedor.innerHTML = '<p style="color: #8892b0; font-size: 0.85em; text-align: center;">Sin promociones registradas.</p>';
            }
        }

        // ================= GESTIÓN EN TIEMPO REAL =================

        // 1. SUBIR O BAJAR JUGADORES (SIN BOTÓN DE GUARDAR)
        async function cambiarJugadores(id, delta, maxCapacidad) {
            try {
                const display = document.getElementById(`val-jugadores-${id}`);
                if (!display) return;

                let actual = parseInt(display.innerText.trim()) || 0;
                let max = parseInt(maxCapacidad) || 50;

                let nuevo = actual + delta;
                if (nuevo < 0) nuevo = 0;
                if (nuevo > max) nuevo = max;
                if (nuevo === actual) return;

                display.innerText = nuevo;
                mostrarAvisoEnVivo(id);

                const { error } = await client.from('mesas').update({ jugadores_actuales: nuevo }).eq('id', id);
                if (error) {
                    alert("Error en Supabase: " + error.message);
                    display.innerText = actual;
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        // 2. CAMBIAR ESTATUS INMEDIATAMENTE AL SELECCIONAR
        async function cambiarEstatus(id, selectElement) {
            const nuevoEstatus = selectElement.value;
            selectElement.className = 'mesa-estatus-select ' + (nuevoEstatus === 'Abierta' ? 'abierta' : 'cerrada');
            mostrarAvisoEnVivo(id);

            const { error } = await client.from('mesas').update({ estatus: nuevoEstatus }).eq('id', id);
            if (error) {
                alert("Error al cambiar estatus: " + error.message);
            }
        }

        // 3. APLICAR FRASE PREESTABLECIDA DE 1 TOQUE
        async function aplicarPreset(id, frase) {
            const inputPromo = document.getElementById(`promo-${id}`);
            if (inputPromo) inputPromo.value = frase;

            mostrarAvisoEnVivo(id);

            const { error } = await client.from('mesas').update({ promo_especial: frase }).eq('id', id);
            if (error) {
                alert("Error al actualizar frase: " + error.message);
            }
        }

        function mostrarAvisoEnVivo(id) {
            const badge = document.getElementById(`badge-guardado-${id}`);
            if (badge) {
                badge.innerText = "⚡ Sincronizado";
                badge.style.display = 'inline';
                setTimeout(() => badge.style.display = 'none', 1800);
            }
        }

        // CREAR MESA
        async function crearMesa() {
            const nombre = document.getElementById('nueva-mesa-nombre').value.trim();
            const juego = document.getElementById('nueva-mesa-juego').value;
            const capacidad = parseInt(document.getElementById('nueva-mesa-capacidad').value) || 7;
            const apuesta_minima = parseInt(document.getElementById('nueva-mesa-apuesta-min').value) || 0;
            const estatus = document.getElementById('nueva-mesa-estatus').value;
            const crupier = document.getElementById('nueva-mesa-crupier').value.trim();
            const jackpot = parseInt(document.getElementById('nueva-mesa-jackpot').value) || 0;
            const promo = document.getElementById('nueva-mesa-promo').value.trim();

            if (!nombre) {
                alert("Escribe el nombre de la mesa.");
                return;
            }

            const { error } = await client.from('mesas').insert([{
                nombre,
                juego,
                capacidad_maxima: capacidad,
                jugadores_actuales: 0,
                apuesta_minima,
                estatus,
                crupier,
                jackpot,
                promo_especial: promo
            }]);

            if (error) {
                alert("Error al crear mesa: " + error.message);
            } else {
                alert("¡Mesa creada con éxito!");
                document.getElementById('nueva-mesa-nombre').value = '';
                document.getElementById('nueva-mesa-crupier').value = '';
                document.getElementById('nueva-mesa-jackpot').value = '0';
                document.getElementById('nueva-mesa-promo').value = '';
                cargarMesas();
            }
        }

        // GUARDAR CAMPOS MANUALES (Crupier, Apuesta Mínima, Jackpot, Promo)
        async function actualizarMesa(id) {
            const crupier = document.getElementById(`crupier-${id}`).value.trim();
            const apuesta_minima = parseInt(document.getElementById(`apuesta-min-${id}`).value) || 0;
            const jackpot = parseInt(document.getElementById(`jackpot-${id}`).value) || 0;
            const promo = document.getElementById(`promo-${id}`).value.trim();

            const { error } = await client.from('mesas').update({
                crupier,
                apuesta_minima,
                jackpot,
                promo_especial: promo
            }).eq('id', id);

            if (error) {
                alert("Error al guardar: " + error.message);
            } else {
                mostrarAvisoEnVivo(id);
            }
        }

        // ELIMINAR MESA
        async function eliminarMesa(id, nombre) {
            if (confirm(`¿Eliminar la ${nombre}?`)) {
                const { error } = await client.from('mesas').delete().eq('id', id);
                if (error) alert("Error: " + error.message);
                else cargarMesas();
            }
        }

        // CARGAR MESAS
        async function cargarMesas() {
            const { data: mesas, error } = await client.from('mesas').select('*').order('juego').order('nombre');
            const cont = document.getElementById('contenedor-mesas-admin');

            if (error) {
                cont.innerHTML = `<p style="color: var(--neon-red); text-align: center;">Error: ${error.message}</p>`;
                return;
            }

            if (mesas && mesas.length > 0) {
                cont.innerHTML = mesas.map(m => {
                    const capMax = m.capacidad_maxima && m.capacidad_maxima > 0 ? m.capacidad_maxima : 10;
                    return `
                    <div class="mesa-item">
                        <div class="mesa-item-top">
                            <span class="mesa-nombre">${m.nombre} (${m.juego})</span>
                            <span id="badge-guardado-${m.id}" style="color: var(--neon-cyan); font-size: 0.8em; display: none; font-weight: bold;">⚡ Sincronizado</span>
                        </div>

                        <div class="mesa-grid">
                            <div>
                                <label>Estatus</label>
                                <select id="estatus-${m.id}" class="mesa-estatus-select ${m.estatus === 'Abierta' ? 'abierta' : 'cerrada'}" onchange="cambiarEstatus('${m.id}', this)">
                                    <option value="Abierta" ${m.estatus === 'Abierta' ? 'selected' : ''}>🟢 Abierta</option>
                                    <option value="Cerrada" ${m.estatus === 'Cerrada' ? 'selected' : ''}>🔴 Cerrada</option>
                                </select>
                            </div>
                            <div>
                                <label>Jugadores (${capMax} máx)</label>
                                <div class="stepper-container">
                                    <button type="button" class="btn-step" onclick="cambiarJugadores('${m.id}', -1, ${capMax})">−</button>
                                    <div class="stepper-display" id="val-jugadores-${m.id}">${m.jugadores_actuales || 0}</div>
                                    <button type="button" class="btn-step" onclick="cambiarJugadores('${m.id}', 1, ${capMax})">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="mesa-grid" style="margin-top: 6px;">
                            <div>
                                <label>Apuesta Mínima ($)</label>
                                <input type="number" id="apuesta-min-${m.id}" value="${m.apuesta_minima || 0}">
                            </div>
                            <div>
                                <label>Jackpot ($)</label>
                                <input type="number" id="jackpot-${m.id}" value="${m.jackpot || 0}">
                            </div>
                        </div>

                        <div class="mesa-grid" style="margin-top: 6px;">
                            <div>
                                <label>Crupier</label>
                                <input type="text" id="crupier-${m.id}" value="${m.crupier || ''}" placeholder="Nombre">
                            </div>
                            <div>
                                <label>Promo o Frase de Alerta</label>
                                <input type="text" id="promo-${m.id}" value="${m.promo_especial || ''}" placeholder="Frase especial">
                            </div>
                        </div>

                        <!-- BOTONES PREDEFINIDOS DE 1 TOQUE -->
                        <div style="margin-top: 8px;">
                            <span style="font-size: 0.72em; color: #8892b0; text-transform: uppercase; font-weight: bold;">Activar frase rápida (1 toque):</span>
                            <div class="preset-badge-group">
                                <button type="button" class="btn-preset fuego" onclick="aplicarPreset('${m.id}', '🔥 MESA CALIENTE')">🔥 Mesa Caliente</button>
                                <button type="button" class="btn-preset fuerte" onclick="aplicarPreset('${m.id}', '⚡ APUESTAS FUERTES')">⚡ Apuestas Fuertes</button>
                                <button type="button" class="btn-preset ultimos" onclick="aplicarPreset('${m.id}', '🚨 ÚLTIMOS LUGARES')">🚨 Últimos Lugares</button>
                                <button type="button" class="btn-preset limpiar" onclick="aplicarPreset('${m.id}', '')">✕ Quitar</button>
                            </div>
                        </div>

                        <div class="mesa-botones">
                            <button class="btn-action btn-save" onclick="actualizarMesa('${m.id}')" style="margin-top: 0; padding: 10px; font-size: 0.9em;">
                                💾 Guardar Crupier/Jackpot
                            </button>
                            <button class="btn-del-mesa" onclick="eliminarMesa('${m.id}', '${m.nombre}')" title="Eliminar">
                                🗑️
                            </button>
                        </div>
                    </div>
                `}).join('');
            } else {
                cont.innerHTML = '<p style="text-align: center; color: #8892b0;">No hay mesas registradas.</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            cargarPromociones();
            cargarMesas();
        });
    </script>
</body>
</html>
