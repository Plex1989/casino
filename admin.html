<!-- MÓDULO: MENSAJES PUSH PARA EL ADMINISTRADOR -->
<!-- ========================================== -->
<div class="admin-push-card">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <span style="font-size: 1.5em;">📢</span>
        <h3 style="margin: 0; color: #00f0ff;">Enviar Alerta Push Masiva</h3>
    </div>
    <p style="color: #8892b0; font-size: 0.9em; margin-top: 0;">
        Escribe un anuncio y llegará de inmediato a la pantalla de bloqueo de todos los clientes con la app.
    </p>
    
    <label for="push-titulo">Título de la Alerta:</label>
    <input type="text" id="push-titulo" placeholder="Ej. 🎁 ¡Bono Especial en Mesas!" />

    <label for="push-mensaje">Mensaje:</label>
    <textarea id="push-mensaje" rows="3" placeholder="Ej. La mesa de Ruleta tiene jackpot acumulado. ¡Aparta tu lugar ahora!"></textarea>

    <button id="btn-enviar-push" onclick="enviarPushDesdeAdmin()">🚀 Enviar a Todos los Clientes</button>
</div>

<style>
    .admin-push-card {
        background: #151722;
        border: 1px solid #b026ff;
        border-radius: 12px;
        padding: 20px;
        margin: 25px 0;
        box-shadow: 0 4px 15px rgba(176, 38, 255, 0.2);
    }
    .admin-push-card label {
        display: block;
        color: white;
        font-weight: bold;
        margin-top: 12px;
        margin-bottom: 6px;
        font-size: 0.9em;
    }
    .admin-push-card input, 
    .admin-push-card textarea {
        width: 100%;
        padding: 12px;
        background: #0b0c10;
        border: 1px solid #2a2d3d;
        border-radius: 8px;
        color: white;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 0.95em;
    }
    .admin-push-card input:focus, 
    .admin-push-card textarea:focus {
        border-color: #00f0ff;
        outline: none;
        box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }
    #btn-enviar-push {
        margin-top: 15px;
        width: 100%;
        padding: 14px;
        background: linear-gradient(90deg, #b026ff, #00f0ff);
        color: white;
        font-weight: bold;
        font-size: 1.05em;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }
    #btn-enviar-push:hover {
        opacity: 0.9;
        transform: scale(1.01);
    }
    #btn-enviar-push:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }
</style>

<script>
    const ONESIGNAL_APP_ID = "15bf381f-0de7-4e12-918b-57db8e55be92";
    const ONESIGNAL_REST_KEY = "os_v2_app_cw7tqhyn45hbfemlk7ny4vn6sjgkrqfztlku3mfyxdsrlsyalbctaur1td5t17q3owurepbcgsmvdacb7h3iayhdkm5z5yjauboor4a";
    const URL_APP_CASINO = "https://casino-three-rho.vercel.app";

    async function enviarPushDesdeAdmin() {
        const inputTitulo = document.getElementById('push-titulo');
        const inputMensaje = document.getElementById('push-mensaje');
        const boton = document.getElementById('btn-enviar-push');

        const titulo = inputTitulo.value.trim();
        const mensaje = inputMensaje.value.trim();

        if (!titulo || !mensaje) {
            alert("Por favor escribe tanto el título como el mensaje.");
            return;
        }

        if (!confirm(`¿Confirmas el envío de esta notificación a todos los clientes?\n\nTítulo: "${titulo}"\nMensaje: "${mensaje}"`)) {
            return;
        }

        boton.disabled = true;
        boton.innerHTML = "⏳ Enviando alerta a todos los celulares...";

        try {
            const respuesta = await fetch("https://onesignal.com/api/v1/notifications", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json; charset=utf-8",
                    "Authorization": `Basic ${ONESIGNAL_REST_KEY}`
                },
                body: JSON.stringify({
                    app_id: ONESIGNAL_APP_ID,
                    included_segments: ["Total Subscriptions"],
                    headings: { "es": titulo, "en": titulo },
                    contents: { "es": mensaje, "en": mensaje },
                    url: URL_APP_CASINO
                })
            });

            const resultado = await respuesta.json();

            if (respuesta.ok && !resultado.errors) {
                alert(`¡Notificación enviada exitosamente!\nDestinatarios aproximados: ${resultado.recipients || 1}`);
                inputTitulo.value = '';
                inputMensaje.value = '';
            } else {
                alert("Error de OneSignal: " + (resultado.errors ? JSON.stringify(resultado.errors) : "No se pudo entregar."));
            }
        } catch (error) {
            alert("Error de conexión al enviar la notificación: " + error.message);
        } finally {
            boton.disabled = false;
            boton.innerHTML = "🚀 Enviar a Todos los Clientes";
        }
    }
</script>
