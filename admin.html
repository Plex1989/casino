<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Control - Casino</title>
    
    <meta name="theme-color" content="#0b0c10">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #151722;
            --neon-cyan: #00f0ff;
            --neon-red: #ff003c;
            --neon-gold: #d4af37;
            --neon-purple: #b026ff;
            --neon-green: #25D366;
            --border-color: #2a2d3d;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
            font-size: 16px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Encabezado */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 15px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .admin-title {
            color: var(--neon-cyan);
            font-size: 1.25em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-logout {
            background: rgba(255, 0, 60, 0.15);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
        }

        /* Tarjetas */
        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .admin-card.push-card {
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.15em;
            color: var(--neon-purple);
        }

        .push-card .card-header h2 {
            color: var(--neon-cyan);
        }

        label {
            display: block;
            color: #c5c6c7;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #0b0c10;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--neon-cyan);
        }

        .pass-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .btn-toggle-eye {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: #8892b0;
            font-size: 1.2em;
            cursor: pointer;
            padding: 5px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1em;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-push {
            background: linear-gradient(90deg, var(--neon-purple), #7928ca);
            color: white;
        }

        .btn-save {
            background: linear-gradient(90deg, #0070f3, var(--neon-cyan));
            color: black;
        }

        /* Mesas */
        .mesa-item {
            background: #0e1017;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .mesa-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .mesa-nombre {
            font-weight: bold;
            font-size: 1.05em;
            color: white;
        }

        .mesa-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mesa-estatus-select {
            padding: 8px;
            font-weight: bold;
            border-radius: 6px;
        }

        .mesa-estatus-select.abierta {
            background: rgba(37, 211, 102, 0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .mesa-estatus-select.cerrada {
            background: rgba(255, 0, 60, 0.15);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        /* Login */
        #seccion-login {
            display: none;
            padding-top: 40px;
        }

        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .login-box img {
            width: 90px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PANTALLA DE LOGIN -->
        <div id="seccion-login">
            <div class="login-box">
                <img src="logo.png" alt="Casino" onerror="this.src='https://via.placeholder.com/90?text=CASINO'">
                <h2 style="color: var(--neon-cyan); margin: 0 0 8px 0; font-size: 1.3em;">Acceso Administrativo</h2>
                <p style="color: #8892b0; font-size: 0.9em; margin-top: 0; margin-bottom: 20px;">Control de Operación del Casino</p>
                
                <div style="text-align: left;">
                    <label>Usuario</label>
                    <input type="text" id="login-user" placeholder="admin" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">

                    <label>Contraseña</label>
                    <div class="pass-wrapper">
                        <input type="password" id="login-pass" placeholder="casino123" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
                        <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility()">👁️</button>
                    </div>
                </div>

                <button class="btn-action btn-save" onclick="iniciarSesion()" style="margin-top: 20px;">
                    Entrar al Panel
                </button>
            </div>
        </div>

        <!-- PANEL PRINCIPAL -->
        <div id="seccion-admin" style="display: none;">
            
            <header class="admin-header">
                <div class="admin-title">
                    <span>🎰</span>
                    <span>Admin Casino</span>
                </div>
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </header>

            <!-- 1. MÓDULO PUSH -->
            <section class="admin-card push-card">
                <div class="card-header">
                    <span style="font-size: 1.4em;">📢</span>
                    <h2>Enviar Notificación Push</h2>
                </div>
                <p style="color: #8892b0; font-size: 0.85em; margin-top: 0;">
                    Llega de inmediato a la pantalla de bloqueo de los clientes suscritos.
                </p>

                <label>Título de la Alerta</label>
                <input type="text" id="push-titulo" placeholder="Ej. 🎁 ¡Ruleta con Jackpot al Máximo!">

                <label>Mensaje</label>
                <textarea id="push-mensaje" rows="2" placeholder="Ej. La mesa ya está abierta. ¡Entra y aparta tu lugar ahora!"></textarea>

                <button class="btn-action btn-push" id="btn-enviar-push" onclick="enviarPush()">
                    🚀 Enviar a Todos los Celulares
                </button>
            </section>

            <!-- 2. GESTOR DE PROMOCIONES -->
            <section class="admin-card">
                <div class="card-header">
                    <span style="font-size: 1.4em;">🏷️</span>
                    <h2>Nueva Promoción</h2>
                </div>

                <label>Tipo de Promoción</label>
                <select id="promo-tipo">
                    <option value="General">📢 General (Tarjeta fija)</option>
                    <option value="Flash">⚡ Oferta Flash (Marquesina roja)</option>
                </select>

                <label>Título</label>
                <input type="text" id="promo-titulo" placeholder="Ej. 2x1 en Bebidas VIP">

                <label>Descripción</label>
                <textarea id="promo-descripcion" rows="2" placeholder="Ej. Válido en mesas abiertas hasta las 11:00 PM."></textarea>

                <button class="btn-action btn-save" onclick="crearPromocion()">
                    ➕ Publicar Promoción
                </button>

                <div id="lista-promos" style="margin-top: 20px;"></div>
            </section>

            <!-- 3. GESTOR DE MESAS EN VIVO -->
            <section class="admin-card">
                <div class="card-header">
                    <span style="font-size: 1.4em;">🎲</span>
                    <h2>Estatus de Mesas</h2>
                </div>
                <p style="color: #8892b0; font-size: 0.85em; margin-top: 0; margin-bottom: 15px;">
                    Actualiza el estado y los jugadores en tiempo real.
                </p>

                <div id="contenedor-mesas-admin">
                    <p style="text-align: center; color: #8892b0;">Cargando mesas...</p>
                </div>
            </section>

        </div>

    </div>

    <script>
        // CONFIGURACIÓN DE BASE DE DATOS
        const SUPABASE_URL = "https://kqgtyzsxwrkomdtuktkk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_on1rkqvAIhSQonTODdk5fA_qTpEo_8H";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // MOSTRAR/OCULTAR CONTRASEÑA
        function togglePasswordVisibility() {
            const passInput = document.getElementById('login-pass');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        // AUTENTICACIÓN LOCAL FLEXIBLE
        function verificarSesion() {
            if (localStorage.getItem('admin_autenticado') === 'true') {
                document.getElementById('seccion-login').style.display = 'none';
                document.getElementById('seccion-admin').style.display = 'block';
                cargarDatosAdmin();
            } else {
                document.getElementById('seccion-login').style.display = 'block';
                document.getElementById('seccion-admin').style.display = 'none';
            }
        }

        function iniciarSesion() {
            const userInput = document.getElementById('login-user').value || '';
            const passInput = document.getElementById('login-pass').value || '';

            // Limpia espacios y pasa a minúsculas
            const user = userInput.trim().toLowerCase().replace(/\s+/g, '');
            const pass = passInput.trim().toLowerCase().replace(/\s+/g, '');

            // Acepta admin y casino123 sin importar mayúsculas o espacios
            if (user === "admin" && pass === "casino123") {
                localStorage.setItem('admin_autenticado', 'true');
                verificarSesion();
            } else {
                alert("Usuario o contraseña incorrectos.\n\nUsuario: admin\nContraseña: casino123");
            }
        }

        function cerrarSesion() {
            if (confirm("¿Cerrar sesión en este dispositivo?")) {
                localStorage.removeItem('admin_autenticado');
                location.reload();
            }
        }

        // ENVÍO DE NOTIFICACIONES PUSH VÍA VERCEL API
        async function enviarPush() {
            const inputTitulo = document.getElementById('push-titulo');
            const inputMensaje = document.getElementById('push-mensaje');
            const btn = document.getElementById('btn-enviar-push');

            const titulo = inputTitulo.value.trim();
            const mensaje = inputMensaje.value.trim();

            if (!titulo || !mensaje) {
                alert("Por favor escribe tanto el título como el mensaje.");
                return;
            }

            if (!confirm(`¿Confirmas el envío de esta notificación a todos los usuarios?\n\n"${titulo}"`)) {
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "⏳ Enviando notificación...";

            try {
                const response = await fetch("/api/push", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ titulo, mensaje })
                });

                const data = await response.json();

                if (response.ok && !data.errors) {
                    alert(`¡Notificación enviada exitosamente!\nDestinatarios: ${data.recipients || 1}`);
                    inputTitulo.value = '';
                    inputMensaje.value = '';
                } else {
                    alert("Error al enviar: " + JSON.stringify(data.errors || data.error));
                }
            } catch (err) {
                alert("Error de conexión: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = "🚀 Enviar a Todos los Celulares";
            }
        }

        // GESTIÓN DE PROMOCIONES
        async function crearPromocion() {
            const tipo = document.getElementById('promo-tipo').value;
            const titulo = document.getElementById('promo-titulo').value.trim();
            const descripcion = document.getElementById('promo-descripcion').value.trim();

            if (!titulo || !descripcion) {
                alert("Completa todos los campos de la promoción.");
                return;
            }

            const { error } = await client.from('promociones').insert([{
                tipo,
                titulo,
                descripcion,
                activa: true
            }]);

            if (error) {
                alert("Error: " + error.message);
            } else {
                document.getElementById('promo-titulo').value = '';
                document.getElementById('promo-descripcion').value = '';
                cargarPromociones();
            }
        }

        async function togglePromo(id, estadoActual) {
            await client.from('promociones').update({ activa: !estadoActual }).eq('id', id);
            cargarPromociones();
        }

        async function eliminarPromo(id) {
            if (confirm("¿Eliminar esta promoción?")) {
                await client.from('promociones').delete().eq('id', id);
                cargarPromociones();
            }
        }

        async function cargarPromociones() {
            const { data: promos } = await client.from('promociones').select('*').order('fecha_creacion', { ascending: false });
            const contenedor = document.getElementById('lista-promos');
            
            if (promos && promos.length > 0) {
                contenedor.innerHTML = promos.map(p => `
                    <div style="background: #0b0c10; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                        <div>
                            <strong style="color: ${p.tipo === 'Flash' ? 'var(--neon-red)' : 'var(--neon-purple)'}; font-size: 0.85em;">[${p.tipo}]</strong>
                            <strong style="color: white; display: block; font-size: 0.95em;">${p.titulo}</strong>
                            <span style="color: #8892b0; font-size: 0.8em;">${p.descripcion}</span>
                        </div>
                        <div style="display: flex; gap: 6px; flex-shrink: 0;">
                            <button onclick="togglePromo(${p.id}, ${p.activa})" style="background: ${p.activa ? 'rgba(37,211,102,0.2)' : 'rgba(255,255,255,0.1)'}; color: ${p.activa ? 'var(--neon-green)' : '#888'}; border: 1px solid ${p.activa ? 'var(--neon-green)' : '#555'}; padding: 6px 10px; border-radius: 6px; font-size: 0.8em; font-weight: bold; cursor: pointer;">
                                ${p.activa ? 'Activa' : 'Pausada'}
                            </button>
                            <button onclick="eliminarPromo(${p.id})" style="background: rgba(255,0,60,0.2); color: var(--neon-red); border: 1px solid var(--neon-red); padding: 6px 10px; border-radius: 6px; font-size: 0.8em; cursor: pointer;">
                                🗑️
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                contenedor.innerHTML = '<p style="color: #8892b0; font-size: 0.85em; text-align: center;">Sin promociones registradas.</p>';
            }
        }

        // GESTIÓN DE MESAS
        async function actualizarMesa(id) {
            const estatus = document.getElementById(`estatus-${id}`).value;
            const crupier = document.getElementById(`crupier-${id}`).value.trim();
            const jugadores = parseInt(document.getElementById(`jugadores-${id}`).value) || 0;
            const jackpot = parseInt(document.getElementById(`jackpot-${id}`).value) || 0;
            const promo = document.getElementById(`promo-${id}`).value.trim();

            const { error } = await client.from('mesas').update({
                estatus,
                crupier,
                jugadores_actuales: jugadores,
                jackpot,
                promo_especial: promo
            }).eq('id', id);

            if (error) {
                alert("Error al guardar: " + error.message);
            } else {
                const badge = document.getElementById(`badge-guardado-${id}`);
                badge.style.display = 'inline';
                setTimeout(() => badge.style.display = 'none', 2000);
            }
        }

        async function cargarMesas() {
            const { data: mesas } = await client.from('mesas').select('*').order('juego').order('nombre');
            const cont = document.getElementById('contenedor-mesas-admin');

            if (mesas && mesas.length > 0) {
                cont.innerHTML = mesas.map(m => `
                    <div class="mesa-item">
                        <div class="mesa-item-top">
                            <span class="mesa-nombre">${m.nombre} (${m.juego})</span>
                            <span id="badge-guardado-${m.id}" style="color: var(--neon-green); font-size: 0.75em; display: none; font-weight: bold;">✓ Guardado</span>
                        </div>

                        <div class="mesa-grid">
                            <div>
                                <label>Estatus</label>
                                <select id="estatus-${m.id}" class="mesa-estatus-select ${m.estatus === 'Abierta' ? 'abierta' : 'cerrada'}" onchange="this.className = 'mesa-estatus-select ' + (this.value === 'Abierta' ? 'abierta' : 'cerrada')">
                                    <option value="Abierta" ${m.estatus === 'Abierta' ? 'selected' : ''}>🟢 Abierta</option>
                                    <option value="Cerrada" ${m.estatus === 'Cerrada' ? 'selected' : ''}>🔴 Cerrada</option>
                                </select>
                            </div>
                            <div>
                                <label>Jugadores</label>
                                <input type="number" id="jugadores-${m.id}" value="${m.jugadores_actuales}" min="0" max="${m.capacidad_maxima}">
                            </div>
                        </div>

                        <div class="mesa-grid" style="margin-top: 6px;">
                            <div>
                                <label>Crupier</label>
                                <input type="text" id="crupier-${m.id}" value="${m.crupier || ''}" placeholder="Nombre">
                            </div>
                            <div>
                                <label>Jackpot ($)</label>
                                <input type="number" id="jackpot-${m.id}" value="${m.jackpot || 0}">
                            </div>
                        </div>

                        <label>Promo Mesa</label>
                        <input type="text" id="promo-${m.id}" value="${m.promo_especial || ''}" placeholder="Ej. Paga 3 a 2 en Blackjack">

                        <button class="btn-action btn-save" onclick="actualizarMesa(${m.id})" style="padding: 10px; font-size: 0.9em; margin-top: 10px;">
                            💾 Guardar Mesa
                        </button>
                    </div>
                `).join('');
            } else {
                cont.innerHTML = '<p style="text-align: center; color: #8892b0;">No hay mesas registradas.</p>';
            }
        }

        function cargarDatosAdmin() {
            cargarPromociones();
            cargarMesas();
        }

        window.addEventListener('DOMContentLoaded', verificarSesion);
    </script>
</body>
</html>
