<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino - Portal Administrativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #0d0e15; --panel-bg: #151722; --neon-cyan: #00f0ff; --neon-purple: #b026ff; --text-main: #ffffff; --text-muted: #8892b0; --btn-orange: #ff9900; --btn-whatsapp: #25D366; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        .navbar { background-color: #0a0b10; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 240, 255, 0.2); }
        .navbar h2 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; }
        #login-section { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 70px); }
        .logo-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, rgba(0,0,0,0) 70%); z-index: 1; }
        #login-logo { position: relative; z-index: 2; width: 120px; filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5)); }
        .login-box { width: 100%; max-width: 350px; text-align: center; margin-top: 30px;}
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { color: var(--text-muted); font-size: 0.8rem; display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; background: var(--panel-bg); border: none; border-bottom: 2px solid #333; color: white; padding: 12px; box-sizing: border-box; font-size: 1rem; transition: 0.3s; }
        .input-group input:focus { outline: none; border-bottom-color: var(--neon-cyan); background: rgba(0, 240, 255, 0.05); }
        .btn-ingresar { width: 100%; background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.3s; margin-top: 10px; }
        .btn-ingresar:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
        #admin-section { display: none; padding: 30px; max-width: 900px; margin: 0 auto; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-whatsapp { background: var(--btn-whatsapp); color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .panel-creacion, .mesa-admin, .promo-admin { background: var(--panel-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(0, 240, 255, 0.3); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
        .panel-promo { border-color: var(--neon-purple); box-shadow: 0 4px 20px rgba(176, 38, 255, 0.15); }
        .form-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group input, .form-group select { background: #0d0e15; border: 1px solid #333; color: white; padding: 12px; border-radius: 6px; flex: 1; min-width: 150px; }
        .form-group input:focus, .form-group select:focus { border-color: var(--neon-cyan); outline: none; }
        .btn-naranja { background: var(--btn-orange); color: black; font-weight: bold; border: none; padding: 12px 25px; border-radius: 20px; cursor: pointer; }
        .btn-morado { background: var(--neon-purple); color: white; font-weight: bold; border: none; padding: 12px 25px; border-radius: 20px; cursor: pointer; }
        .mesa-admin, .promo-admin { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-left: 5px solid #4CAF50; }
        .controles { display: flex; gap: 10px; align-items: center; }
        .btn-accion { background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); border-radius: 4px; padding: 8px 15px; cursor: pointer;}
        .btn-accion:hover { background: rgba(0,240,255,0.1); }
        .btn-peligro { border-color: #e0241b; color: #e0241b; }
        .btn-peligro:hover { background: rgba(224, 36, 27, 0.1); }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2>CASINO EN VIVO</h2>
    </nav>

    <div id="login-section">
        <div class="logo-container">
            <div class="logo-glow"></div>
            <img src="logo.png" id="login-logo" alt="Logo Casino" onerror="this.src='https://via.placeholder.com/120?text=LOGO'">
        </div>
        <div class="login-box">
            <h1>INICIAR SESIÓN</h1>
            <p>Portal Administrativo</p>
            <div class="input-group"><label>👤 Usuario</label><input type="text" id="user-input"></div>
            <div class="input-group"><label>🔒 Contraseña</label><input type="password" id="pass-input"></div>
            <button class="btn-ingresar" onclick="verificarLogin()">INGRESAR ➔</button>
            <p id="login-error" style="color: #e0241b; display: none;">Datos incorrectos</p>
        </div>
    </div>

    <div id="admin-section">
        <div class="header-admin">
            <h2 style="color: var(--neon-cyan); margin: 0;">Gestión de Mesas y Promos</h2>
            <button class="btn-whatsapp" onclick="compartirWhatsApp()">📱 Compartir Portal</button>
        </div>

        <!-- PANEL DE PROMOCIONES -->
        <div class="panel-creacion panel-promo">
            <h3 style="margin-top: 0; color: var(--neon-purple);">📢 Lanzar Promoción</h3>
            <div class="form-group">
                <input type="text" id="promo-titulo" placeholder="Título (ej. ¡Bono 10% Extra!)" style="flex: 2;">
                <select id="promo-tipo" style="flex: 1;">
                    <option value="General">Promoción General</option>
                    <option value="Flash">⚡ Promo Flash (Urgencia)</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="promo-desc" placeholder="Descripción de la oferta...">
            </div>
            <button class="btn-morado" onclick="agregarPromocion()">Activar Promoción</button>
        </div>
        <div id="admin-promos-container" style="margin-bottom: 40px;"></div>

        <!-- PANEL DE MESAS -->
        <div class="panel-creacion">
            <h3 style="margin-top: 0; color: var(--btn-orange);">+ Abrir Nueva Mesa</h3>
            <div class="form-group">
                <div style="display:flex; flex:1; gap:10px;">
                    <select id="nuevo-juego" onchange="verificarNuevoJuego()" style="flex:1;">
                        <option value="Ruleta">Ruleta</option>
                        <option value="Blackjack">Blackjack</option>
                        <option value="Bacará">Bacará</option>
                        <option value="Texas Bonus">Texas Bonus</option>
                        <option value="Dados">Dados (Craps)</option>
                        <option value="OTRO">+ Agregar otro...</option>
                    </select>
                    <input type="text" id="juego-personalizado" placeholder="¿Qué juego?" style="display:none; flex:1;">
                </div>
                <input type="text" id="nuevo-nombre" placeholder="Nombre (ej. VIP)">
            </div>
            <div class="form-group">
                <input type="number" id="nuevo-minimo" placeholder="Apuesta Mínima ($)">
                <input type="number" id="nueva-capacidad" placeholder="Capacidad Total">
            </div>
            <button class="btn-naranja" onclick="agregarMesa()">Aperturar Mesa</button>
        </div>
        <div id="admin-mesas-container"></div>
    </div>

    <script>
        function verificarLogin() {
            if(document.getElementById('user-input').value === 'admin' && document.getElementById('pass-input').value === 'casino123') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                cargarDatosAdmin(); 
            } else { document.getElementById('login-error').style.display = 'block'; }
        }

        function compartirWhatsApp() {
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(`🎰 ¡Checa las mesas abiertas y promos en vivo! ${window.location.origin}`)}`, '_blank');
        }

        function verificarNuevoJuego() {
            const select = document.getElementById('nuevo-juego');
            const inputPersonalizado = document.getElementById('juego-personalizado');
            inputPersonalizado.style.display = select.value === 'OTRO' ? 'block' : 'none';
        }

        const client = supabase.createClient('https://kqgtyzsxwrkomdtuktkk.supabase.co', 'sb_publishable_on1rkqvAIhSQonTODdk5fA_qTpEo_8H');

        async function cargarDatosAdmin() {
            // Cargar Mesas
            const { data: mesas } = await client.from('mesas').select('*').order('nombre');
            document.getElementById('admin-mesas-container').innerHTML = mesas.map(m => `
                <div class="mesa-admin" style="border-left-color: ${m.estatus === 'Abierta' ? '#00f0ff' : '#e0241b'}">
                    <div><strong style="font-size: 1.2em;">${m.nombre}</strong><br><small style="color: var(--text-muted);">${m.juego} | Mín: $${m.apuesta_minima}</small></div>
                    <div class="controles">
                        <div style="background: #0d0e15; padding: 5px 15px; border-radius: 20px; border: 1px solid #333; display: flex; gap: 15px; align-items: center;">
                            <button class="btn-accion" style="border:none; padding:0;" onclick="actualizarCampo('mesas', '${m.id}', 'jugadores_actuales', ${m.jugadores_actuales - 1})">-</button>
                            <span>${m.jugadores_actuales} / ${m.capacidad_maxima} Jug.</span>
                            <button class="btn-accion" style="border:none; padding:0;" onclick="actualizarCampo('mesas', '${m.id}', 'jugadores_actuales', ${m.jugadores_actuales + 1})">+</button>
                        </div>
                        <button class="btn-accion" style="color: ${m.estatus === 'Abierta' ? '#e0241b' : '#00f0ff'}; border-color: ${m.estatus === 'Abierta' ? '#e0241b' : '#00f0ff'};" 
                                onclick="actualizarCampo('mesas', '${m.id}', 'estatus', '${m.estatus === 'Abierta' ? 'Cerrada' : 'Abierta'}')">${m.estatus === 'Abierta' ? 'Cerrar Mesa' : 'Abrir Mesa'}</button>
                        <button class="btn-accion btn-peligro" onclick="borrarRegistro('mesas', '${m.id}')">🗑️</button>
                    </div>
                </div>`).join('');

            // Cargar Promos
            const { data: promos } = await client.from('promociones').select('*').order('fecha_creacion', { ascending: false });
            document.getElementById('admin-promos-container').innerHTML = promos.map(p => `
                <div class="promo-admin" style="border-left-color: ${p.tipo === 'Flash' ? '#e0241b' : '#b026ff'}">
                    <div><strong style="color:${p.tipo === 'Flash' ? '#e0241b' : '#b026ff'}">${p.tipo === 'Flash' ? '⚡ FLASH:' : '📢 GENERAL:'} ${p.titulo}</strong><br><small>${p.descripcion}</small></div>
                    <div class="controles">
                        <button class="btn-accion" style="color: ${p.activa ? '#e0241b' : '#4CAF50'}; border-color: ${p.activa ? '#e0241b' : '#4CAF50'};" 
                                onclick="actualizarCampo('promociones', '${p.id}', 'activa', ${!p.activa})">${p.activa ? 'Desactivar' : 'Activar'}</button>
                        <button class="btn-accion btn-peligro" onclick="borrarRegistro('promociones', '${p.id}')">🗑️</button>
                    </div>
                </div>`).join('');
        }

        async function agregarMesa() {
            let juego = document.getElementById('nuevo-juego').value;
            if (juego === 'OTRO') juego = document.getElementById('juego-personalizado').value;
            const nombre = document.getElementById('nuevo-nombre').value, min = document.getElementById('nuevo-minimo').value, cap = document.getElementById('nueva-capacidad').value;
            if(!nombre || !min || !cap || !juego) return alert("Llena todos los campos");
            await client.from('mesas').insert([{ juego: juego, nombre: nombre, apuesta_minima: min, capacidad_maxima: cap, estatus: 'Abierta' }]);
            ['nuevo-nombre','nuevo-minimo','nueva-capacidad','juego-personalizado'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('nuevo-juego').value = 'Ruleta'; verificarNuevoJuego();
            cargarDatosAdmin();
        }

        async function agregarPromocion() {
            const titulo = document.getElementById('promo-titulo').value, desc = document.getElementById('promo-desc').value, tipo = document.getElementById('promo-tipo').value;
            if(!titulo) return alert("Ponle un título a la promoción");
            await client.from('promociones').insert([{ titulo: titulo, descripcion: desc, tipo: tipo, activa: true }]);
            document.getElementById('promo-titulo').value = ''; document.getElementById('promo-desc').value = '';
            cargarDatosAdmin();
        }

        async function actualizarCampo(tabla, id, campo, valor) {
            await client.from(tabla).update({ [campo]: valor }).eq('id', id); cargarDatosAdmin();
        }
        async function borrarRegistro(tabla, id) {
            if(confirm("¿Seguro que quieres borrar esto?")) { await client.from(tabla).delete().eq('id', id); cargarDatosAdmin(); }
        }

        client.channel('admin-updates').on('postgres_changes', { event: '*', schema: 'public' }, cargarDatosAdmin).subscribe();
    </script>
</body>
</html>
