<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino - Estatus en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            max-width: 600px;
            margin: 0 auto;
        }
        .promo { 
            background: linear-gradient(45deg, #FFD700, #FDB931); 
            color: black; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }
        .mesa { 
            background: #1e1e1e; 
            padding: 15px; 
            margin-bottom: 12px; 
            border-radius: 8px; 
            border-left: 5px solid #4CAF50;
        }
        .cerrada { 
            border-left-color: #f44336; 
            opacity: 0.6; 
        }
        .caliente { 
            border: 2px solid #ff9800; 
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.4); 
        }
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        .stats { display: flex; justify-content: space-between; color: #aaa; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id="promos-container"></div>
    <h2>Mesas de Juego</h2>
    <div id="mesas-container"><p>Conectando con el piso del casino...</p></div>

    <script>
        // Credenciales inyectadas
        const supabaseUrl = 'https://kqgtyzsxwrkomdtuktkk.supabase.co';
        const supabaseKey = 'sb_publishable_on1rkqvAIhSQonTODdk5fA_qTpEo_8H';
        
        // Cambiamos el nombre de la variable a "client" para evitar el error de sintaxis
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        async function cargarDatos() {
            const { data: promos } = await client.from('promociones').select('*').eq('activa', true).order('orden');
            
            if (promos && promos.length > 0) {
                document.getElementById('promos-container').innerHTML = promos.map(p => `
                    <div class="promo">
                        <strong>📢 ${p.titulo}</strong><br>
                        ${p.descripcion}
                    </div>
                `).join('');
            } else {
                document.getElementById('promos-container').innerHTML = '';
            }

            const { data: mesas } = await client.from('mesas').select('*').order('nombre');
            
            if (mesas && mesas.length > 0) {
                document.getElementById('mesas-container').innerHTML = mesas.map(m => `
                    <div class="mesa ${m.estatus === 'Cerrada' ? 'cerrada' : ''} ${m.mesa_caliente ? 'caliente' : ''}">
                        <h3 style="margin-top:0;">${m.nombre} ${m.mesa_caliente ? '🔥' : ''}</h3>
                        <div class="stats">
                            <span><strong>Estatus:</strong> ${m.estatus}</span>
                            <span><strong>Mínimo:</strong> $${m.apuesta_minima}</span>
                        </div>
                        <div class="stats" style="margin-top: 8px;">
                            <span><strong>Juego:</strong> ${m.juego}</span>
                            <span><strong>Ocupación:</strong> ${m.jugadores_actuales} / ${m.capacidad_maxima} lugares</span>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Suscripción en tiempo real usando "client"
        client.channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'mesas' }, cargarDatos)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'promociones' }, cargarDatos)
            .subscribe();

        // Cargar datos iniciales
        cargarDatos();
    </script>
</body>
</html>
