<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino - Estatus en Vivo</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0c10">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- OneSignal SDK para Notificaciones Push -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "15bf381f-0de7-4e12-918b-57db8e55be92",
        });

        // Actualiza el botón al cargar la página
        actualizarEstadoBoton();

        // Escucha en tiempo real si el cliente acepta o cancela los permisos
        OneSignal.User.PushSubscription.addEventListener("change", function(e) {
            actualizarEstadoBoton();
        });
      });

      // LÓGICA DE ACTIVACIÓN Y DESACTIVACIÓN (DIRECTA Y SIN RETRASOS)
      async function toggleAlertas() {
        if (!("Notification" in window)) {
            alert("Lo sentimos, tu navegador no soporta notificaciones.");
            return;
        }

        // 1. SI NUNCA HA DADO PERMISO (Se pide instantáneamente al tocar, sin pasar por OneSignal primero)
        if (Notification.permission === "default") {
            const permiso = await Notification.requestPermission();
            
            if (permiso === "granted") {
                window.OneSignalDeferred.push(function(OneSignal) {
                    OneSignal.User.PushSubscription.optIn();
                });
                alert("¡Notificaciones activadas exitosamente!");
            } else {
                alert("Permiso denegado. No te enviaremos alertas.");
            }
        } 
        // 2. SI YA NOS HABÍA DADO PERMISO ANTES
        else if (Notification.permission === "granted") {
            window.OneSignalDeferred.push(function(OneSignal) {
                const isSubscribed = OneSignal.User.PushSubscription.optedIn;
                if (isSubscribed) {
                    OneSignal.User.PushSubscription.optOut();
                    alert("Notificaciones desactivadas. Ya no recibirás alertas.");
                } else {
                    OneSignal.User.PushSubscription.optIn();
                    alert("¡Notificaciones reactivadas exitosamente!");
                }
            });
        } 
        // 3. SI EL USUARIO LAS BLOQUEÓ MANUALMENTE
        else {
            alert("Tienes las notificaciones bloqueadas en este navegador. Ve a la configuración de la app o del navegador para permitirlas.");
        }
        
        // Actualizamos la vista del botón después de procesar
        setTimeout(actualizarEstadoBoton, 500);
      }

      function actualizarEstadoBoton() {
        window.OneSignalDeferred.push(function(OneSignal) {
            const btn = document.getElementById('btn-alertas');
            if (!btn) return;

            if (OneSignal.User.PushSubscription.optedIn) {
                // ESTADO ACTIVO
                btn.className = "btn-alertas-activo";
                btn.innerHTML = "✅ Alertas Activas (Toca para desactivar)";
            } else {
                // ESTADO INACTIVO
                btn.className = "btn-alertas-inactivo";
                btn.innerHTML = "🔔 Activar Alertas";
            }
        });
      }
    </script>

    <style>
        :root { --bg-color: #0b0c10; --card-bg: #151722; --neon-cyan: #00f0ff; --neon-red: #ff003c; --neon-gold: #d4af37; --neon-purple: #b026ff; --btn-whatsapp: #25D366; }
        body { background-color: var(--bg-color); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; overflow-x: hidden; padding-bottom: 100px; }
        
        .header-logo { text-align: center; margin-bottom: 20px; }
        .header-logo img { width: 120px; filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4)); }

        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseGlowRed { 0% { box-shadow: 0 0 5px var(--neon-red); } 50% { box-shadow: 0 0 20px var(--neon-red); } 100% { box-shadow: 0 0 5px var(--neon-red); } }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        @keyframes jackpotPulse { 0% { color: #fff; text-shadow: 0 0 5px var(--neon-gold); } 50% { color: var(--neon-gold); text-shadow: 0 0 20px var(--neon-gold); } 100% { color: #fff; text-shadow: 0 0 5px var(--neon-gold); } }
        @keyframes pulsePromoMesa { 0% { border-color: var(--neon-purple); } 50% { border-color: rgba(176,38,255,0.3); } 100% { border-color: var(--neon-purple); } }
        @keyframes blinkDot { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulseGlowPurple { 0% { box-shadow: 0 0 5px rgba(176,38,255,0.5); } 100% { box-shadow: 0 0 20px rgba(176,38,255,0.8); } }

        /* Estilos del botón de alertas */
        #btn-alertas { display: block; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1.1em; margin-bottom: 25px; cursor: pointer; transition: 0.3s; text-align: center; }
        .btn-alertas-inactivo { background-color: var(--neon-purple); color: white; border: none; animation: pulseGlowPurple 2s infinite alternate; }
        .btn-alertas-activo { background-color: rgba(76, 175, 80, 0.1); color: #4CAF50; border: 1px solid #4CAF50; animation: none; box-shadow: none; }

        .promo { padding: 15px 20px; border-radius: 12px; margin-bottom: 25px; animation: slideIn 0.5s ease-out; position: relative; overflow: hidden; }
        .promo-general { background: var(--card-bg); border: 1px solid #2a2d3d; border-left: 5px solid var(--neon-purple); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .promo-general strong { color: var(--neon-purple); font-size: 1.1em; letter-spacing: 1px; text-transform: uppercase; }
        
        .promo-flash { background: #1a0505; border: 1px solid var(--neon-red); border-left: 5px solid var(--neon-red); animation: pulseGlowRed 1.5s infinite alternate, slideIn 0.5s ease-out; }
        .promo-flash .flash-title { color: white; background: var(--neon-red); padding: 2px 10px; border-radius: 4px; font-weight: bold; font-size: 0.85em; display: inline-block; margin-bottom: 10px; letter-spacing: 1px; }
        .flash-marquee { white-space: nowrap; overflow: hidden; box-sizing: border-box; }
        .flash-marquee p { display: inline-block; padding-left: 100%; animation: scrollText 10s linear infinite; margin: 0; color: #ff9999; font-weight: bold; font-size: 1.1em; }

        h2 { color: var(--neon-cyan); border-bottom: 1px solid rgba(0,240,255,0.2); padding-bottom: 10px; text-transform: uppercase; font-size: 1.2em; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center;}
        
        .mesa { background: var(--card-bg); padding: 20px 15px; margin-bottom: 20px; border-radius: 12px; border-left: 5px solid #4CAF50; transition: 0.3s; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .cerrada { border-left-color: #e0241b; opacity: 0.7; }
        .stats { display: flex; justify-content: space-between; align-items: center; color: #8892b0; font-size: 0.95em; margin-top: 10px; flex-wrap: wrap; gap: 5px;}
        
        .badge { background: rgba(0,240,255,0.1); color: var(--neon-cyan); padding: 4px 10px; border-radius: 4px; font-size: 0.85em; border: 1px solid rgba(0,240,255,0.3); align-self: flex-start; flex-shrink: 0; }
        
        .jackpot-texto { font-size: 1.1em; font-weight: bold; text-align: center; margin-top: 15px; background: rgba(212,175,55,0.1); padding: 10px; border-radius: 6px; animation: jackpotPulse 1.5s infinite; border: 1px dashed var(--neon-gold); }
        .promo-mesa-activa { margin-top: 15px; padding: 12px; background: rgba(176, 38, 255, 0.05); border: 1px dashed var(--neon-purple); border-radius: 8px; color: #dfb3ff; font-size: 0.9em; text-align: center; animation: pulsePromoMesa 2s infinite; }
        .promo-mesa-activa strong { color: var(--neon-purple); }
        .btn-reservar { background: var(--btn-whatsapp); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
        .btn-reservar:hover { background: #1ebe57; transform: scale(1.05); }

        .icono-juego { width: 95px; height: 95px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.8)); flex-shrink: 0; }
        
        .mesa-header { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .mesa-titulo { margin: 0; color: white; font-size: 1.4em; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;}
        
        .live-badge { display: flex; align-items: center; gap: 6px; color: var(--neon-red); font-size: 0.55em; font-weight: bold; letter-spacing: 1px; border: 1px solid var(--neon-red); padding: 3px 8px; border-radius: 12px; background: rgba(255, 0, 60, 0.1); text-shadow: none; margin-top: 2px; flex-shrink: 0; }
        .live-dot { width: 8px; height: 8px; background-color: var(--neon-red); border-radius: 50%; animation: blinkDot 1s infinite; box-shadow: 0 0 5px var(--neon-red); }

        .flotantes-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .btn-flotante { background-color: #1f2833; color: white; border: 1px solid var(--neon-cyan); border-radius: 50px; padding: 12px 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .btn-flotante.wa { background-color: var(--btn-whatsapp); border: none; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
        .btn-flotante:active { transform: scale(0.95); }

        /* Botón Fijo Superior de Instalación */
        .btn-instalar-top { background: linear-gradient(90deg, #00f0ff, #0088ff); color: black; border: none; width: 100%; padding: 12px; font-weight: bold; font-size: 1.1em; border-radius: 8px; margin-bottom: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3); animation: pulseGlow 2s infinite alternate; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 5px rgba(0,240,255,0.5); } 100% { box-shadow: 0 0 20px rgba(0,240,255,0.8); } }
        
        #modal-instalar { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
        .modal-content { background: #151722; border: 2px solid var(--neon-cyan); border-radius: 12px; padding: 25px; text-align: center; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        /* MAGIA CSS: OCULTAR BOTÓN DE INSTALACIÓN SI LA APP YA ESTÁ INSTALADA */
        @media (display-mode: standalone) {
            .btn-instalar-top { display: none !important; }
        }
    </style>
</head>
<body>
    
    <button class="btn-instalar-top" onclick="abrirModalInstalacion()">📲 Instalar App del Casino</button>

    <div id="modal-instalar">
        <div class="modal-content">
            <h3 style="color: var(--neon-cyan); margin-top: 0; font-size: 1.5em;">Instalar Aplicación</h3>
            <p id="texto-modal-instalar" style="color: white; line-height: 1.6; font-size: 1.1em;"></p>
            <button onclick="procederInstalacion()" style="background: var(--neon-cyan); color: black; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1.1em;">Instalar Ahora</button>
            <button onclick="document.getElementById('modal-instalar').style.display='none'" style="background: transparent; color: #8892b0; border: none; padding: 10px; cursor: pointer; display: block; width: 100%; margin-top: 10px;">Cerrar</button>
        </div>
    </div>

    <div class="header-logo"><img src="logo.png" alt="Casino" onerror="this.src='https://via.placeholder.com/120?text=LOGO'"></div>

    <!-- EL NUEVO BOTÓN SUPERIOR E INTELIGENTE DE NOTIFICACIONES -->
    <button id="btn-alertas" class="btn-alertas-inactivo" onclick="toggleAlertas()">
        🔔 Activar Alertas
    </button>

    <div id="promos-container"></div>

    <div style="background: linear-gradient(90deg, #0d1a10, #142b18); border: 1px solid #25D366; border-radius: 12px; padding: 15px; margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2); flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 15px; flex: 1; min-width: 200px;">
            <div style="background: #25D366; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5em; flex-shrink: 0;">💬</div>
            <div>
                <strong style="color: #25D366; font-size: 1.1em; display: block;">Radar VIP Casino</strong>
                <span style="color: #bbb; font-size: 0.85em;">Recibe alertas de mesas calientes y bonos exclusivos.</span>
            </div>
        </div>
        <button onclick="window.open('https://api.whatsapp.com/send?phone=522282311773&text=Hola,%20me%20gustar%C3%ADa%20unirme%20al%20grupo%20VIP%20del%20casino.', '_blank')" style="background: #25D366; color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; flex-shrink: 0;">Unirme</button>
    </div>
    
    <h2>EN EL PISO HOY</h2>
    <div id="mesas-container"><p style="text-align:center; color:#8892b0;">Conectando con las mesas...</p></div>

    <div class="flotantes-container">
        <button class="btn-flotante" onclick="pedirMenu()">🍸 Menú Bar</button>
        <button class="btn-flotante wa" onclick="compartirAppCliente()">📱 Compartir</button>
    </div>

    <script>
        const numeroCasino = "522282311773";
        let deferredPrompt;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function abrirModalInstalacion() {
            document.getElementById('modal-instalar').style.display = 'flex';
            const texto = document.getElementById('texto-modal-instalar');
            
            if (isIOS) {
                texto.innerHTML = "Para instalar la App en tu iPhone:<br><br>1. Toca el ícono de <b>Compartir</b> abajo en tu pantalla.<br><br>2. Selecciona <b>'Agregar a Inicio'</b>.<br><br>¡Listo! La App aparecerá junto a tus demás aplicaciones.";
            } else {
                texto.innerHTML = "Presiona 'Instalar Ahora' para agregar la aplicación directamente a la pantalla principal de tu celular.<br><br>Es rápido, seguro y no ocupa espacio.";
            }
        }

        function procederInstalacion() {
            document.getElementById('modal-instalar').style.display = 'none';
            if (!isIOS && deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') console.log('Usuario instaló la App');
                    deferredPrompt = null;
                });
            } else if (isIOS) {
                alert("Sigue las instrucciones tocando el botón de Compartir en tu navegador.");
            }
        }

        function compartirAppCliente() {
            const urlPublica = window.location.href;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(`🎰 ¡Checa las mesas abiertas y promos de hoy en el Casino! Entra aquí: ${urlPublica}`)}`, '_blank');
        }
        function pedirMenu() { window.open(`https://api.whatsapp.com/send?phone=${numeroCasino}&text=${encodeURIComponent('Hola, me podrían compartir el menú del restaurante/bar de hoy. ¡Gracias!')}`, '_blank'); }
        function reservarMesa(nombreMesa) { window.open(`https://api.whatsapp.com/send?phone=${numeroCasino}&text=${encodeURIComponent(`Hola, voy en camino. ¿Me pueden confirmar si hay lugar en la mesa de ${nombreMesa}?`)}`, '_blank'); }

        const client = supabase.createClient('https://kqgtyzsxwrkomdtuktkk.supabase.co', 'sb_publishable_on1rkqvAIhSQonTODdk5fA_qTpEo_8H');
        const imagenesJuegos = { 'Ruleta': 'ruleta.gif', 'Blackjack': 'blackjack.png', 'Bacará': 'bacara.png', 'Texas Bonus': 'texas.png', 'Dados': 'dados.png' };

        async function cargarDatos() {
            const { data: promos } = await client.from('promociones').select('*').eq('activa', true).order('fecha_creacion', { ascending: false });
            if (promos && promos.length > 0) {
                document.getElementById('promos-container').innerHTML = promos.map(p => {
                    if(p.tipo === 'Flash') {
                        return `<div class="promo promo-flash"><div class="flash-title">⚡ OFERTA FLASH</div><strong style="color: white; font-size: 1.2em; display:block; margin-bottom:5px;">${p.titulo}</strong><div class="flash-marquee"><p>${p.descripcion} &nbsp;&nbsp;🎰&nbsp;&nbsp; ${p.descripcion}</p></div></div>`;
                    } else {
                        return `<div class="promo promo-general"><strong>📢 ${p.titulo}</strong><br><span style="color: #bbb;">${p.descripcion}</span></div>`;
                    }
                }).join('');
            } else { document.getElementById('promos-container').innerHTML = ''; }

            const { data: mesas } = await client.from('mesas').select('*').order('juego').order('nombre');
            if (mesas && mesas.length > 0) {
                document.getElementById('mesas-container').innerHTML = mesas.map(m => {
                    const archivoImagen = imagenesJuegos[m.juego];
                    const iconoHTML = archivoImagen ? `<img src="${archivoImagen}" class="icono-juego" alt="${m.juego}" onerror="this.style.display='none'">` : '';
                    const botonReservar = m.estatus === 'Abierta' ? `<button class="btn-reservar" onclick="reservarMesa('${m.nombre}')">🟢 Reservar Lugar</button>` : '';
                    const infoCrupier = m.crupier ? `<span style="color:var(--neon-cyan);">🃏 Crupier: <strong>${m.crupier}</strong></span>` : '<span></span>';
                    const promoExclusiva = m.promo_especial ? `<div class="promo-mesa-activa"><strong>🎁 PROMO:</strong> ${m.promo_especial}</div>` : '';
                    const indicadorEnVivo = m.estatus === 'Abierta' ? `<div class="live-badge"><div class="live-dot"></div>EN VIVO</div>` : '';
                    
                    return `
                    <div class="mesa ${m.estatus === 'Cerrada' ? 'cerrada' : ''}">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div class="mesa-header">
                                ${iconoHTML}
                                <h3 class="mesa-titulo">
                                    ${m.nombre} 
                                    ${indicadorEnVivo}
                                </h3>
                            </div>
                            <span class="badge">${m.juego}</span>
                        </div>
                        
                        <div class="stats" style="margin-top:20px;">
                            <span>Mínimo: <strong style="color:white;">$${m.apuesta_minima}</strong></span>
                            <span>Ocupación: <strong style="color:white;">${m.jugadores_actuales} / ${m.capacidad_maxima}</strong></span>
                        </div>

                        <div class="stats" style="margin-top:10px; border-top:1px solid #2a2d3d; padding-top:12px;">
                            ${infoCrupier}
                            ${botonReservar}
                        </div>

                        ${m.jackpot > 0 ? `<div class="jackpot-texto">💰 JACKPOT: $${m.jackpot.toLocaleString('en-US')}</div>` : ''}
                        ${promoExclusiva}
                    </div>`
                }).join('');
            }
        }

        client.channel('public-changes').on('postgres_changes', { event: '*', schema: 'public' }, cargarDatos).subscribe();
        cargarDatos();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Lista'))
                .catch(err => console.log('Error PWA:', err)); 
            });
        }
    </script>
</body>
</html>
